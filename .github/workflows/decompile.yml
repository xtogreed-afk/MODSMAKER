name: Decompile mod
on:
  push:
    branches: ['addonstudio/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  decompile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Download Vineflower
        run: curl -fsSL -o vineflower.jar https://github.com/Vineflower/vineflower/releases/download/1.10.1/vineflower-1.10.1.jar
      - name: Decompile classes
        run: |
          mkdir -p out src
          java -jar vineflower.jar -dgs=1 -asc=1 input.jar out/
          if ls out/*.jar >/dev/null 2>&1; then
            for j in out/*.jar; do unzip -q -o "$j" -d src; done
          else
            cp -r out/. src/
          fi
      - name: Add resources
        run: unzip -q -o input.jar -x '*.class' 'META-INF/jars/*' 'META-INF/MANIFEST.MF' -d src || true
      - uses: actions/upload-artifact@v4
        with:
          name: decompiled-src
          path: src/
          if-no-files-found: error
